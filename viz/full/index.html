<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wikipedia Explorations</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a work surface. A full-width top bar (title, search, map controls), the map filling
   the rest, and a drawer on the right holding the selected page and reference lists. */
:root {
  --sheet: #f6f8f9; --panel: #ffffff; --ink: #10202c; --ink-2: #4a5a66; --rule: #d5dce1; --accent: #1c5cab;
  --glow: #0a6fe0; --glow2: #c2410c; --glow3: #15803d; --core: #06264d;
  --b0: #2a78d6; --b1: #eb6834; --b2: #1baf7a; --b3: #eda100; --b4: #e87ba4; --b5: #008300; --b6: #6250d6; --b7: #e34948;
  --b8: #7d8a93; --b9: #a9b3ba;
  /* kinds of thing: up to fifteen families; the two leftover groups use the grays above */
  --k0: #2a78d6; --k1: #eb6834; --k2: #1baf7a; --k3: #008300; --k4: #eda100; --k5: #e87ba4; --k6: #e34948; --k7: #8a2b2b;
  --k8: #6250d6; --k9: #12a5c4; --k10: #9ab82a; --k11: #b44fc2; --k12: #8d6238; --k13: #c9a070; --k14: #1f4e8c;
  /* specificity: a ramp that changes hue as well as lightness, strongest at the general end; the last is "not scored" */
  --g0: #2a0a6b; --g1: #8a1fa6; --g2: #d1366b; --g3: #ee7f35; --g4: #e0b84a; --g5: #d9d3a8; --g6: #a9b3ba;
  /* charts: a link or step to a more general article, and to a more specific one; what was counted, and what was guessed */
  --up: #2a78d6; --down: #eb6834; --obs: #2a78d6; --hyp: #eb6834;
  --display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --bar: 54px; --drawer: 372px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --sheet: #0d141c; --panel: #131c27; --ink: #e6edf2; --ink-2: #9fb0bd; --rule: #25323f; --accent: #86b6ef;
    --glow: #5fdcff; --glow2: #ffb454; --glow3: #a5f26a; --core: #ffffff;
    --b0: #3987e5; --b1: #d95926; --b2: #199e70; --b3: #c98500; --b4: #d55181; --b5: #008300; --b6: #9085e9; --b7: #e66767;
    --b8: #6f7d88; --b9: #47535e;
    --k0: #3987e5; --k1: #d95926; --k2: #199e70; --k3: #2f9a2f; --k4: #c98500; --k5: #d55181; --k6: #e66767; --k7: #a84444;
    --k8: #9085e9; --k9: #2bb3d0; --k10: #a3bf3a; --k11: #c06bd0; --k12: #a37a4e; --k13: #d2b48c; --k14: #5f8fd0;
    --g0: #ffe14d; --g1: #ff8f3c; --g2: #e6457e; --g3: #a455e0; --g4: #4f6fd0; --g5: #33406e; --g6: #47535e;
    --up: #3987e5; --down: #d95926; --obs: #3987e5; --hyp: #d95926;
    color-scheme: dark;
  }
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--sheet); color: var(--ink); font: 14px/1.45 var(--body); }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas.dragging { cursor: grabbing; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
.num { font: 12px var(--mono); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* Top bar */
#bar { position: fixed; inset: 0 0 auto 0; height: var(--bar); box-sizing: border-box; z-index: 5; display: flex; align-items: center; gap: 16px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--rule); }
h1 { font: 400 25px/1 var(--display); margin: 0; white-space: nowrap; }
h1 em { color: var(--accent); }
.search { position: relative; flex: 0 1 380px; min-width: 120px; }
.search input { width: 100%; box-sizing: border-box; font: 14px var(--body); padding: 7px 10px; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px; }
.search input:focus { border-color: var(--ink-2); }
#results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; margin: 0; padding: 0; list-style: none; background: var(--panel); border: 1px solid var(--ink-2); border-radius: 3px; max-height: 320px; overflow-y: auto; }
#results button { display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: left; font: 14px var(--body); color: var(--ink); background: none; border: 0; padding: 7px 10px; cursor: pointer; }
#results button:hover, #results button:focus-visible { background: var(--sheet); }
#results span { font: 12px var(--mono); color: var(--ink-2); white-space: nowrap; }
#status { flex: 1; min-width: 0; margin: 0; font: 11px var(--mono); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tools { display: flex; gap: 4px; }
.tools button { white-space: nowrap; font: 500 13px var(--mono); min-width: 34px; height: 32px; padding: 0 9px; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px; cursor: pointer; }
.tools button:hover { border-color: var(--ink-2); }
.tools button[aria-expanded="true"], .tools button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.tools .gap { margin-left: 8px; }

/* Drawer */
#drawer { position: fixed; top: var(--bar); right: 0; bottom: 0; width: min(var(--drawer), 100vw); box-sizing: border-box; z-index: 4; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--rule); }
#drawer details { border-bottom: 1px solid var(--rule); }
#drawer summary { display: flex; align-items: center; gap: 8px; padding: 12px 16px; cursor: pointer; list-style: none; font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
#drawer summary::-webkit-details-marker { display: none; }
#drawer summary::before { content: "›"; font-size: 15px; line-height: 1; transition: transform 0.15s; }
#drawer details[open] > summary::before { transform: rotate(90deg); }
#drawer details[open] > summary { color: var(--ink); }
#drawer summary .count { margin-left: auto; font-weight: 400; letter-spacing: 0; text-transform: none; }
#drawer .body { padding: 0 16px 16px; }
#drawer h2 { font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); margin: 14px 0 6px; }
#drawer p { margin: 4px 0; }
.muted { color: var(--ink-2); font-size: 12.5px; }

#sel h3 { font: 400 28px/1.05 var(--display); margin: 0 0 6px; overflow-wrap: anywhere; }
#sel ol { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 2px 6px; font-size: 13px; }
#sel ol li:not(:last-child)::after { content: "→"; color: var(--ink-2); margin-left: 6px; }
#sel ul { margin: 0; padding: 0; list-style: none; font-size: 13px; }
#sel ul li { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px dotted var(--rule); }
#sel button.link { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; text-decoration: underline; text-underline-offset: 2px; }
#sel .act { font: 500 12px var(--mono); color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px; padding: 5px 9px; margin: 10px 6px 0 0; cursor: pointer; }
#sel .act:hover { border-color: var(--ink-2); }
#sel .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }

#journeys ol, #key ol, #kinds ol { margin: 0; padding: 0; list-style: none; font-size: 13px; }
#journeys li button { display: grid; grid-template-columns: 2.2em 1fr auto; gap: 6px; width: 100%; font: inherit; color: var(--ink); background: none; border: 0; border-bottom: 1px dotted var(--rule); padding: 5px 0; cursor: pointer; text-align: left; }
#journeys li button:hover, #key button:hover, #kinds button:hover { background: var(--sheet); }
#kinds button[aria-pressed="true"], #key button[aria-pressed="true"] { background: var(--sheet); font-weight: 600; }
body.by-kind #key .sw { background: var(--b8) !important; }      /* basin colors are not on the map just now */
#journeys li small { grid-column: 2 / 4; color: var(--ink-2); font-size: 11.5px; }
#key button, #kinds button { display: flex; gap: 8px; align-items: baseline; width: 100%; font: inherit; color: var(--ink); background: none; border: 0; border-bottom: 1px dotted var(--rule); padding: 5px 0; cursor: pointer; text-align: left; }
#key .sw, #kinds .sw { flex: none; width: 9px; height: 9px; border-radius: 50%; }
#key .grow, #kinds .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Color key on the map itself, for basins or kinds, shown whether or not the drawer is open */
#mapkey { position: fixed; left: 14px; bottom: 14px; z-index: 3; margin: 0; padding: 8px 6px 6px; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--rule); border-radius: 4px; max-width: 250px; }
#mapkey h2 { font: 500 10px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); margin: 0 6px 4px; }
#mapkey ol { margin: 0; padding: 0; list-style: none; }
#mapkey button { display: flex; align-items: center; gap: 8px; width: 100%; font: 12.5px var(--body); color: var(--ink); background: none; border: 0; border-radius: 3px; padding: 2px 6px; cursor: pointer; text-align: left; }
#mapkey button:hover { background: var(--sheet); }
#mapkey button[aria-pressed="true"] { background: var(--sheet); font-weight: 600; }
#mapkey.solo button[aria-pressed="false"] { opacity: 0.5; }
#mapkey .sw { flex: none; width: 10px; height: 10px; border-radius: 50%; }
#mapkey .num { margin-left: auto; padding-left: 10px; font-size: 11px; }
#tip { position: fixed; z-index: 6; pointer-events: none; background: var(--ink); color: var(--sheet); padding: 5px 8px; font-size: 13px; border-radius: 3px; max-width: 260px; }
#tip span { font: 12px var(--mono); opacity: 0.85; display: block; }

/* Charts, here and on the Structure page */
svg text { font: 11px var(--mono); fill: var(--ink-2); }
svg .strong { fill: var(--ink); }
svg .halo { paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
svg .grid { stroke: var(--rule); stroke-width: 1; }
svg .base { stroke: var(--ink-2); stroke-width: 1; }
svg .obs { fill: var(--obs); }
svg .obsline { fill: none; stroke: var(--obs); stroke-width: 2; stroke-linejoin: round; }
svg .hyp { fill: none; stroke: var(--hyp); stroke-width: 2; stroke-dasharray: 5 4; }
svg .hit { fill: transparent; }
svg .up { stroke: var(--up); } svg .down { stroke: var(--down); } svg .flat, svg .none { stroke: var(--ink-2); }
#structure svg, #sel svg { display: block; max-width: 100%; height: auto; overflow: visible; }
.key { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 6px 0; font-size: 12.5px; color: var(--ink-2); }
.key i { display: inline-block; width: 16px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 6px; }
.key i.box { height: 10px; border: 0; border-radius: 2px; }
.key i.dash { border-top-style: dashed; }

/* Route profile in the drawer: the selected route laid out straight, height showing how general each page is */
#sel svg .halo, #sel svg circle.page { stroke: var(--panel); }
#sel svg .seg { fill: none; stroke-width: 2.5; stroke-linecap: round; }
#sel svg .seg.none, #sel svg .seg.back { stroke-dasharray: 3 4; stroke-width: 1.5; }
#sel svg .hit { cursor: pointer; }

/* Structure page: covers the map; the bar stays */
#structure { position: fixed; inset: var(--bar) 0 0 0; z-index: 4; overflow-y: auto; background: var(--sheet); }
body.structure #drawer, body.structure #mapkey, body.structure #tint, body.structure #sets, body.structure #status,
body.structure #zin, body.structure #zout, body.structure #zfit, body.structure #dbtn { display: none; }
.st { max-width: 860px; margin: 0 auto; padding: 34px 20px 90px; font-size: 15px; line-height: 1.6; }
.st h2 { font: 400 44px/1.05 var(--display); margin: 0 0 14px; }
.st h3 { font: 400 30px/1.12 var(--display); margin: 0 0 8px; }
.st h4 { font: 600 14px var(--body); margin: 26px 0 4px; }
.st p { max-width: 66ch; margin: 8px 0; }
.st .lede { font-size: 17px; }
.st section { margin-top: 58px; padding-top: 26px; border-top: 1px solid var(--rule); }
.st .part { font: 500 13px var(--mono); color: var(--ink-2); margin: 0 0 6px; }
.st figure { margin: 18px 0 6px; }
.st .note { color: var(--ink-2); font-size: 13px; }
.st .pick { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 14px 0 4px; font-size: 13px; color: var(--ink-2); }
.st .pick .tools { flex-wrap: wrap; }
.st .pick button { height: 30px; font-size: 12px; }
.st .pick label { display: inline-flex; align-items: center; gap: 6px; }
.st select { font: 13px var(--body); height: 30px; padding: 0 8px; color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 3px; }
.st .stats { display: flex; flex-wrap: wrap; gap: 14px 44px; margin: 16px 0 6px; }
.st .stats strong { display: block; font: 400 52px/1 var(--display); color: var(--ink); }
.st .stats span { color: var(--ink-2); font-size: 13px; }
.st details.nums { margin: 6px 0 0; font-size: 12.5px; color: var(--ink-2); }
.st details.nums summary { cursor: pointer; width: fit-content; }
.st table { border-collapse: collapse; font-size: 13px; margin-top: 6px; }
.st th, .st td { padding: 4px 10px; text-align: right; border-bottom: 1px solid var(--rule); font-variant-numeric: tabular-nums; white-space: nowrap; }
.st th { font-weight: 500; color: var(--ink-2); vertical-align: bottom; white-space: normal; }
.st th:first-child, .st td:first-child { text-align: left; padding-left: 0; }
.st .scroll { overflow-x: auto; }
.st .heat td.v { color: var(--ink); min-width: 62px; }
.st .tomap { font: 500 13px var(--mono); height: 34px; padding: 0 14px; color: var(--panel); background: var(--ink); border: 1px solid var(--ink); border-radius: 3px; cursor: pointer; }
.st .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; }
.bars .row { display: grid; grid-template-columns: minmax(96px, 200px) 1fr 50px; gap: 10px; align-items: center; padding: 3px 0; font-size: 13px; }
.bars .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .track { position: relative; height: 14px; border-radius: 2px; background: color-mix(in srgb, var(--rule) 50%, transparent); }
.bars.half .track::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; border-left: 1px solid var(--ink-2); }
.bars .fill { display: block; height: 100%; min-width: 2px; border-radius: 0 3px 3px 0; background: var(--up); }
.bars .fill.down { background: var(--down); }
.st .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 40px; }
/* a drawing of an article: gray bars are words, colored chips are links */
.page { border: 1px solid var(--rule); border-radius: 4px; background: var(--panel); padding: 20px 22px 8px; max-width: 760px; }
.page .ttl { height: 16px; width: 44%; border-radius: 2px; background: var(--ink); opacity: 0.75; margin-bottom: 14px; }
.page .hd { height: 11px; width: 26%; border-radius: 2px; background: var(--ink); opacity: 0.5; margin: 18px 0 12px; }
.page .reg { display: grid; grid-template-columns: 1fr 210px; gap: 22px; align-items: center; padding: 10px 0; border-top: 1px dotted var(--rule); }
.page .reg:first-of-type { border-top: 0; }
.page .txt { display: flex; flex-wrap: wrap; gap: 7px 5px; align-content: flex-start; }
.page .txt.list { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 18px; }
.page .txt.list div { display: flex; gap: 5px; align-items: center; }
.page .txt.list div::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--ink-2); }
.page .wd { height: 8px; border-radius: 2px; background: var(--rule); }
.page .lk { height: 14px; min-width: 30px; padding: 0 5px; margin: -3px 0; border-radius: 3px; font: 600 10px/14px var(--mono); color: #fff; text-align: center; background: var(--up); }
.page .lk.down { background: var(--down); }
.page .say strong { font: 400 38px/1 var(--display); display: block; }
.page .say small { display: block; color: var(--ink-2); font-size: 12.5px; line-height: 1.4; }
.page .say .where { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
@media (max-width: 720px) {
  .st { padding: 22px 16px 70px; } .st h2 { font-size: 34px; } .st h3 { font-size: 25px; } .st .stats strong { font-size: 42px; }
  .st .two { grid-template-columns: 1fr; }
  .page { padding: 14px 14px 4px; } .page .reg { grid-template-columns: 1fr; gap: 8px; }
  #views button { padding: 0 6px; font-size: 11px; }
  body.structure .search { display: none; }
}
@media (max-width: 720px) {
  #bar { gap: 8px; padding: 0 10px; }
  h1 { font-size: 19px; } h1 span { display: none; }
  #status, #zin, #zout { display: none; }
  #sets button, #tint button { padding: 0 6px; font-size: 11px; }
  #drawer { top: auto; left: 0; width: 100%; height: 46vh; border-left: 0; border-top: 1px solid var(--rule); }
  #mapkey { left: 8px; bottom: auto; top: calc(var(--bar) + 8px); }
  #mapkey .num { display: none; }
}
</style>
</head>
<body>
<canvas id="map" aria-label="Zoomable river map of first-link paths on Wikipedia"></canvas>
<header id="bar">
  <h1><span>Wikipedia </span><em>Explorations</em></h1>
  <div class="tools" id="views" role="group" aria-label="Map or charts" hidden>
    <button data-view="map" aria-pressed="true" title="The map of paths">Map</button><button data-view="structure" aria-pressed="false" title="Charts of what the paths and the links have in common">Structure</button>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Find any article" autocomplete="off" aria-label="Find any article">
    <ul id="results" hidden></ul>
  </div>
  <div class="tools" id="sets" role="group" aria-label="Which link each article follows" hidden></div>
  <div class="tools" id="tint" role="group" aria-label="What the colors show" hidden>
    <button data-by="basin" title="Color each stream by the cycle it ends in">Basins</button><button data-by="kind" title="Color each article by what kind of thing it is">Kinds</button><button data-by="spec" title="Color each article by how general or specific its subject is" hidden>Specificity</button>
  </div>
  <p id="status">Loading the map…</p>
  <div class="tools">
    <button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Show the whole map">Fit</button>
    <button id="dbtn" class="gap" aria-expanded="true" aria-controls="drawer">Panel</button>
  </div>
</header>
<aside id="drawer" aria-label="Details">
  <details id="aboutBox"><summary>About this Map</summary><div class="body muted" id="about"></div></details>
  <details id="selBox" open hidden><summary>Selected page</summary><div class="body" id="sel"></div></details>
  <details id="jBox" hidden><summary>Longest journeys <span class="count num" id="jCount"></span></summary><div class="body" id="journeys"></div></details>
  <details id="kindBox" hidden><summary>Kinds of thing <span class="count num" id="cCount"></span></summary><div class="body" id="kinds"></div></details>
  <details id="keyBox"><summary>Largest basins <span class="count num" id="kCount"></span></summary><div class="body" id="key"></div></details>
</aside>
<nav id="mapkey" aria-label="Color key: kinds of thing" hidden></nav>
<main id="structure" aria-label="Structure: charts" hidden></main>
<div id="tip" hidden></div>

<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const fmt = (v) => v.toLocaleString("en-US"), pct = (v) => (100 * v).toFixed(1) + "%";
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const ROOT = new URLSearchParams(location.search).get("data") || "data/";
  const TILE_PX = 300, MAX_TILES = 500, WIDTHS = [0.45, 0.9, 1.4, 2.1, 3.0, 4.2, 5.6, 7.2];
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---- The data set on show. Switching layout swaps all of this.
  let base = ROOT, meta = null, exists = {}, SIZE = 1, LEVELS = 1, epoch = 0;
  const tiles = new Map(), shards = new Map();
  const getJSON = async (path) => { const r = await fetch(base + path); if (!r.ok) throw new Error(path); return r.json(); };

  // ---- View: k = screen px per stored unit, (cx, cy) = world point at the center of the screen
  const canvas = $("map"), ctx = canvas.getContext("2d");
  const under = document.createElement("canvas"), uctx = under.getContext("2d");   // the map itself, redrawn only when it changes
  let W = 0, H = 0, dpr = 1, view = { k: 1, cx: 0, cy: 0 }, dirty = true, css = {};
  let CX = 0, CY = 0, VW = 1, VH = 1;          // center and size of the part of the map not covered by the bar and drawer
  const sx = (x) => (x - view.cx) * view.k + CX, sy = (y) => (y - view.cy) * view.k + CY;
  const wx = (px) => (px - CX) / view.k + view.cx, wy = (py) => (py - CY) / view.k + view.cy;
  const fitK = () => Math.min(VW, VH) / SIZE * 0.95, maxK = () => 18 / meta.q;

  // The route laid out straight: one page per step, left to right, and the more general the page the higher it sits.
  // The map's route bends with the shape of the whole network; here only the direction of each step is left.
  function profile(path, loops) {
    const n = path.length, WD = 340, L = 44, R = 12, T = 10, H = 108, lo = Math.log10(0.005), span = 2 - lo;
    // rank as a share of all articles, 0 = most general; the two top bands are finer than the stored rank
    const val = (d) => (d.s < 0 ? null : d.g === 0 ? 0.005 : d.g === 1 ? 0.03 : Math.max(0.1, d.s / 10));
    const vals = path.map(val), y = (v) => (v == null ? T + H : T + H * (Math.log10(v) - lo) / span);
    const gap = Math.min(70, (WD - L - R - 10) / Math.max(1, n - 1)), x = (i) => L + 10 + i * gap;
    const way = (a, b) => (a == null || b == null ? "none" : b < a ? "up" : b > a ? "down" : "flat");
    const bounds = [0.005, 0.01, 0.1, 1, 10, 50, 100];
    let g = "";
    for (const v of [0.01, 0.1, 1, 10, 100]) g += `<line class="grid" x1="${L}" x2="${WD - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}%</text>`;
    for (let b = 0; b < 6; b++) g += `<rect x="${L - 4}" y="${y(bounds[b])}" width="3" height="${y(bounds[b + 1]) - y(bounds[b])}" fill="var(--g${b})"/>`;

    if (loops) {                      // the step that closes the cycle, drawn back under the line
      const k = path.indexOf(route[route.length - 1]);
      ways.push(way(vals[n - 1], vals[k]));
      if (k < n - 1) g += `<path class="seg back ${ways[n - 1]}" d="M${x(n - 1)} ${y(vals[n - 1])} Q${(x(n - 1) + x(k)) / 2} ${Math.min(T + H + 46, Math.max(y(vals[n - 1]), y(vals[k])) + 34)} ${x(k)} ${y(vals[k])}"/>`;
    }
    path.forEach((d, i) => {

      g += `<circle class="page" cx="${x(i)}" cy="${y(vals[i])}" r="${i ? 4 : 5.5}" stroke-width="1.5" fill="var(--g${d.g >= 0 ? d.g : 6})"/>` +
        `<circle class="hit" cx="${x(i)}" cy="${y(vals[i])}" r="${Math.max(6, Math.min(11, gap / 2))}" data-id="${d.id}" data-tip="${esc(said)}"/>`;

    return `<h2>Route profile</h2>
      <svg viewBox="0 0 ${WD} ${T + H + (loops ? 50 : 30)}" role="img" aria-label="The route as a straight line; height shows how general each page is">${g}</svg>
      <p class="key"><span><i style="border-color:var(--up)"></i>to a more general page</span><span><i style="border-color:var(--down)"></i>to a more specific page</span></p>
      <p class="muted">The same route, straightened. Higher is more general: the scale is the share of all articles that are more general than the page.
      ${steps ? `<strong>${ups} of ${steps}</strong> step${steps === 1 ? "" : "s"} here lead${steps === 1 ? "s" : ""} to a more general page${downs ? `, ${downs} to a more specific one` : ""}.` : ""}${loops ? " The dashed curve is the step that closes the cycle." : ""}</p>`;
  }
  addEventListener("keydown", (e) => { if (e.key === "Escape" && selected && document.activeElement !== $("q")) deselect(); });

  function stepsChart(M, w, kind) {

    if ($("skind")) $("skind").onchange = (e) => { sKind = +e.target.value; drawStructure(); };
    if ($("smask")) $("smask").onchange = (e) => { sMask = e.target.checked; drawStructure(); };
    el.querySelector(".tomap").onclick = () => setView("map");
  }

  let variants = [];          // a data folder may hold several maps of the same articles, one per link rule
  try { const r = await fetch(ROOT + "variants.json"); if (r.ok) variants = await r.json(); } catch (err) { /* a single data set */ }
  if (variants.length > 1) {
    const pick = (id) => {
      const v = variants.find((x) => x.id === id) || variants[0];
      $("sets").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.id === v.id));
      variantId = v.id; writeHash();
      open(ROOT + v.path);          // keeps the selected article, wherever it sits in the other map
    };
    $("sets").innerHTML = variants.map((v) => `<button data-id="${esc(v.id)}" title="${esc(v.about || "")}">${esc(v.name)}</button>`).join("");
    $("sets").hidden = false;
    $("sets").querySelectorAll("button").forEach((b) => (b.onclick = () => pick(b.dataset.id)));
    pick(asked[0]);
  } else open(ROOT + (variants[0] ? variants[0].path : ""));
  try { const r = await fetch(ROOT + "structure.json"); if (r.ok) S = await r.json(); } catch (err) { /* no charts for this data */ }
  if (S) { $("views").hidden = false; if (asked.includes("structure")) setView("structure"); }
})();
</script>
</body>
</html>
